<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>{{ "글 수정" if post else "새 글쓰기" }} — ENTER 블로그 관리</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.snow.min.css" rel="stylesheet">
<style>
  body{font-family:-apple-system,"Noto Sans KR",sans-serif; background:#F6F6F1; color:#10182B; margin:0; padding:32px}
  .wrap{max-width:780px; margin:0 auto}
  a.back{color:#6B6558; font-size:13px; text-decoration:none}
  h1{font-size:20px; margin-top:6px}
  label{display:block; font-size:12px; font-weight:700; color:#6B6558; margin:16px 0 6px}
  input[type=text], textarea, select{
    width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid #DCD8CC; border-radius:8px;
    font-size:14px; font-family:inherit; background:#fff;
  }
  textarea{resize:vertical; min-height:50px}
  #editor{height:420px; background:#fff}
  .btn{display:inline-block; background:#B98A3D; color:#10182B; padding:11px 22px; border-radius:999px; font-weight:700; border:none; font-size:14px; cursor:pointer; margin-top:20px}
  .btn:disabled{opacity:.5; cursor:default}
  .msg{margin-top:14px; font-size:13px; white-space:pre-wrap}
  .msg.error{color:#b3261e}
  .msg.success{color:#1E6F50}
  .msg.success a{color:#1E6F50; font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← 글 목록</a>
  <h1>{{ "글 수정" if post else "새 글쓰기" }}</h1>

  <label>제목</label>
  <input type="text" id="title" value="{{ post.h1 if post else '' }}" placeholder="제목을 입력하세요">

  <label>태그</label>
  <select id="tag">
    {% for t in tags %}
    <option value="{{ t }}" {% if post and post.tag == t %}selected{% endif %}>{{ t }}</option>
    {% endfor %}
  </select>

  <label>리드 문구 (목록·검색결과에 보이는 요약, 1~2문장)</label>
  <textarea id="lead">{{ post.intro if post else "" }}</textarea>

  <label>본문</label>
  <div id="editor">{{ (post.body_html | safe) if post and post.body_html else "" }}</div>

  <button class="btn" id="publishBtn">발행</button>
  <div class="msg" id="msg"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/quill/1.3.7/quill.min.js"></script>
<script>
const quill = new Quill('#editor', {
  theme: 'snow',
  modules: {
    toolbar: {
      container: [
        [{ header: [2, 3, false] }],
        ['bold', 'italic', 'underline'],
        [{ list: 'ordered' }, { list: 'bullet' }],
        ['link', 'image'],
        ['clean']
      ],
      handlers: { image: imageHandler }
    }
  }
});

function imageHandler() {
  const input = document.createElement('input');
  input.setAttribute('type', 'file');
  input.setAttribute('accept', 'image/*');
  input.click();
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    const fd = new FormData();
    fd.append('image', file);
    const res = await fetch('/api/upload-image', { method: 'POST', body: fd });
    const data = await res.json();
    if (data.url) {
      const range = quill.getSelection(true);
      quill.insertEmbed(range.index, 'image', data.url);
    } else {
      alert(data.error || '이미지 업로드 실패');
    }
  };
}

const slug = {{ (slug | tojson) if slug else "null" }};
const msgEl = document.getElementById('msg');
const btn = document.getElementById('publishBtn');

btn.addEventListener('click', async () => {
  const title = document.getElementById('title').value.trim();
  const tag = document.getElementById('tag').value;
  const lead = document.getElementById('lead').value.trim();
  const body_html = quill.root.innerHTML;

  btn.disabled = true;
  msgEl.className = 'msg';
  msgEl.textContent = '발행 중... (빌드+배포까지 수십 초 걸릴 수 있습니다)';

  try {
    const res = await fetch('/api/publish', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ slug, title, tag, lead, body_html })
    });
    const data = await res.json();
    if (data.success) {
      msgEl.className = 'msg success';
      msgEl.innerHTML = '발행 완료! <a href="' + data.url + '" target="_blank">' + data.url + '</a>';
    } else {
      msgEl.className = 'msg error';
      msgEl.textContent = data.error || '발행 실패';
    }
  } catch (e) {
    msgEl.className = 'msg error';
    msgEl.textContent = '요청 실패: ' + e;
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
