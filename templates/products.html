{% extends "base.html" %}
{% block content %}
<section style="padding-top:28px">
  <div class="wrap">
    <div class="eyebrow">{{ page.eyebrow }}</div>
    <h1>{{ page.h1 }}</h1>

    <table>
      <tr><th>상품</th><th>비고</th></tr>
      {% for name, note in page.products_table %}
      <tr><td>{{ name }}</td><td>{{ note }}</td></tr>
      {% endfor %}
    </table>

    <h2 style="margin-top:28px">취급 통신사</h2>
    <ul class="doclist">
      {% for c in page.carriers %}<li>{{ c }}</li>{% endfor %}
    </ul>
  </div>
</section>
{% endblock %}
