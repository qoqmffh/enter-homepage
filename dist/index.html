<script>
(function () {
  try {
    var params = new URLSearchParams(location.search);
    var force = params.get('intro') === '1';
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var skip = false;
    if (!force) {
      try {
        var last = localStorage.getItem('enter_intro_seen');
        if (last && (Date.now() - parseInt(last, 10)) < 24 * 60 * 60 * 1000) skip = true;
      } catch (e) {}
    }
    if (!reduce && !skip) {
      document.documentElement.classList.add('cinema-pending');
    }
  } catch (e) {}
})();
</script>
